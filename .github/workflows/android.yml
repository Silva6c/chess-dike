# 持续集成：仅手动触发（Actions 页面 Run workflow），推送不自动构建
name: Build-XQDK

on:
  workflow_dispatch:

# 产物只作为 artifact 挂在本次运行上。2026-10-28 规范化：删除永不触发的
# Release 发布步骤（workflow_dispatch 触发下 if: event_name == 'push' 恒假，
# 属死逻辑）；恢复自动发布等恢复推送时另行立项。上传 artifact 无需写权限。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # versionCode = git 提交数（见 app/build.gradle.kts 的 gitCommitCount），需要完整历史
    - name: checkout codes
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 签名出库后 CI 无 cchess.release.jks 与密码，构建自动回退 debug 签名
    # （见 build.gradle.kts 的 release signingConfig 回退逻辑）
    - name: Assemble Release APKs
      run: ./gradlew assembleArmv8Release assembleArmv8-dotprodRelease --stacktrace

    - name: Zip APKs
      run: |
        mkdir -p dist
        find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
        cd dist
        for f in *.apk; do zip "${f%.apk}.zip" "$f"; done
        ls -l

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XQDK-apks
        path: dist/*.zip
