# 稳定版自动构建：v* 语义化版本 tag（如 v3.2）推送触发；只有人工确认的稳定版本才
# 推送/tag（版本发布纪律），普通开发期提交留在本地，不触发任何 CI。旧制 stable-*
# 日期 tag 已于 2026-10-31 废弃（历史 tag 保留但不再触发构建），应用内检查更新
# 双制式兼容（AppUpdateChecker）。
# 版权物注入：桔库开局库与 ONNX 识别模型不进 git（.gitignore 版权红线），一次性
# 上传到本仓 Release 的 assets 标签（prerelease，防污染 latest 语义），构建时经
# gh 下载注入——缺资产时自检步失败提示上传，不产出缺件的残废包。
# 安全基线（2026-10-31 体检）：所有第三方 action pin 到完整 commit SHA（防上游
# tag 劫持）；签名密钥经 Secrets 注入真签 release，挂 Release 前有证书指纹门禁。
name: Build-XQDK

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # 手动补包/重跑：同样注入资产跑单测，只挂 artifact 不动 Release

permissions:
  contents: write # tag 触发时向 Release 上传产物需要

# 产物名内嵌日期（app/build.gradle.kts 用 SimpleDateFormat 取 JVM 本地时区）：
# runner 是 UTC，不设 TZ 产物日期会比北京时间早一天（内阁 stable-20261028 首跑实录教训）
env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # versionCode = git 提交数（app/build.gradle.kts 的 gitCommitCount），需要完整历史
    - name: checkout codes
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: '0'

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 版权物注入：ONNX 模型文件名硬编码于 OnnxBoardRecognizer.kt，保持原名直接落
    # models/；桔库文件名硬编码于 BHDatabase.java（桔库09.09.2023精修库.obk），
    # assets Release 侧存 ASCII 名规避中文资源名的 URL 编码问题，此处改名落位。
    # pattern 精确到文件名（防 assets Release 上多余 .onnx 被一并打包）
    - name: 下载版权物资产注入 assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p app/src/main/assets/models app/src/main/assets/databases
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "4_v6-0301.onnx" --dir app/src/main/assets/models --clobber
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "nano_v3-0319.onnx" --dir app/src/main/assets/models --clobber
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "XQDK-obk.zip" --dir app/src/main/assets/databases --clobber
        mv app/src/main/assets/databases/XQDK-obk.zip \
           "app/src/main/assets/databases/桔库09.09.2023精修库.obk.zip"

    # 资产自检：存在性 + sha256 完整性双验——资产损坏/被篡改时失败提示重传，
    # 不产出内容必坏的 APK（digest 取自 GitHub API 资产元数据；更新资产时同步更新此表）
    - name: 资产自检
      run: |
        cd app/src/main/assets
        echo "fbd895d40ab81b41b8188f881866485678b7871775821aa50cfe74004a1dc796  models/4_v6-0301.onnx" | sha256sum -c -
        echo "cb1c1eb93370cb9c6bd65bc8a8b0f5ddc8dbc34cfc83ca902c447960b6ef7e3c  models/nano_v3-0319.onnx" | sha256sum -c -
        echo "e7403a1e2efeeaa0a60de5905135b53865f3d37157e65c4fff4d25aadec48942  databases/桔库09.09.2023精修库.obk.zip" | sha256sum -c -
        ls -la models databases

    # runner 预装 SDK 未必含 compileSdk 34 与钉定的 NDK 25.1，先接受 license
    # 让 gradle/sdkmanager 自动补装
    - name: Accept SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

    # 签名密钥注入（2026-10-31 密钥轮换后 CI 真签 release）：密钥 base64 与双密码
    # 存于仓库 Secrets（ANDROID_KEYSTORE_B64 / ANDROID_STORE_PWD / ANDROID_KEY_PWD）。
    # 未配置时（fork/克隆）跳过注入，构建自动回退 debug 签名——tag 构建会被下方
    # 指纹门禁拦截，debug 签名包不会流出到 Release。
    - name: 注入 release 签名密钥
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        STORE_PWD: ${{ secrets.ANDROID_STORE_PWD }}
        KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/cchess.release.2026.jks
          printf 'CCHES_STORE_PWD=%s\nCCHES_KEY_PWD=%s\n' "$STORE_PWD" "$KEY_PWD" > local.properties
          echo "release 签名密钥已注入（真签构建）"
        else
          echo "::warning::未配置签名 Secrets，本次构建回退 debug 签名"
        fi

    - name: Unit tests
      run: bash gradlew :app:testArmv8-dotprodDebugUnitTest --no-daemon --console=plain

    - name: Assemble Release APKs
      run: bash gradlew assembleArmv8Release assembleArmv8-dotprodRelease --no-daemon --console=plain

    - name: Collect APKs
      run: |
        mkdir -p dist
        find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
        ls -l dist

    # 签名指纹门禁：tag 构建挂 Release 前逐包核验证书指纹=官方现行密钥（2026-10-31
    # 轮换后的 cchess.release.2026.jks，指纹与 README 公示一致），防"Secrets 缺失/
    # 配错 → debug 签名包混入官方 Release"（debug 包不能覆盖安装，还会训练用户
    # 接受卸载重装，削弱签名防线）。指纹为公开信息，硬编码在此即官方信任锚。
    - name: 签名指纹门禁
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        EXPECTED="9ca440393471915a0e6983c53db714133f36f7d327cb487b8a82451d6427721d"
        APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        FAIL=0
        for apk in dist/*-release.apk; do
          GOT=$("$APKSIGNER" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/{print tolower($NF)}')
          echo "$apk -> $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::签名指纹不符（预期官方现行密钥）：$apk"
            FAIL=1
          fi
        done
        exit $FAIL

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: XQDK-apks
        path: dist/*.apk

    # tag（v* 语义化版本）触发时挂到同名 Release：没有则创建，已有则补挂资产
    - name: Attach to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: dist/*.apk
        body: |
          稳定版自动构建（tag：${{ github.ref_name }}）。versionCode = git 提交数，版本名与构建配置见 `app/build.gradle.kts`。

          - `*_armv8-dotprod-release.apk`：推荐变体，需 ARMv8.2 dotprod 指令集（骁龙855 / 麒麟990 / 天玑1000 及以上）
          - `*_armv8-release.apk`：兼容变体，供不支持 dotprod 的老机器

          > **签名说明**：自 v3.2 起本页 APK 均由官方签名密钥构建签名（2026-10-31 密钥
          > 轮换后的新证书 + 发布指纹门禁）——**v3.2 及之后的版本为官方安全版本线**。
          > **从 v3.1 及更早版本升级需先卸载再安装**（证书已更换，仅此一次，之后恢复覆盖升级）。
          > 详见 [README](https://github.com/Silva6c/chess-dike#官方获取渠道与签名核验)。
