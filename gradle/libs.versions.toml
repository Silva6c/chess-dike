[versions]
agp = "8.8.2"
kotlin = "1.9.24"
# NDK 钉本机实际安装版本（catalog 曾写 26.3 但从未安装，实际生效的是 build.gradle.kts
# 里的硬编码 25.1——两处冲突已收敛到这里单点管理）；升 26.x 等本机安装后再动
ndk = "25.1.8937393"
coreKtx = "1.13.1"
junit = "4.13.2"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"
constraintlayout = "2.1.4"
# 依赖版本收编：原先散落在 build.gradle.kts 的硬编码统一入 catalog（升级改这里）
tflite = "2.14.0"
onnxruntime = "1.17.1"
sqliteAssetHelper = "2.0.1"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# 曾写 `+` 动态版本：构建不可复现，已钉死为本机实际解析到的 2.0.1
sqliteassethelper = { group = "com.readystatesoftware.sqliteasset", name = "sqliteassethelper", version.ref = "sqliteAssetHelper" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
